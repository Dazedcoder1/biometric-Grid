services:
  backend:
    build: .
    container_name: biometric_backend
    restart: always
    # Credentials live in .env (gitignored), not in this file.
    # Copy .env.example -> .env and fill it in before `docker compose up`.
    env_file:
      - .env
    ports:
      - "9000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
