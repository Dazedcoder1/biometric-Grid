# nginx for a single-page app.
#
# The whole point of this file is `try_files ... /index.html`. Without it,
# nginx looks for a file at /vault, finds none, and returns 404 — even though
# the app handles that route perfectly well once index.html has loaded.
#
# It only bites on a direct load or a refresh: clicking through the app never
# asks the server, because React Router rewrites the URL client-side. So the
# bug looks intermittent and gets blamed on caching.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed filenames change whenever content changes, so they can be cached
    # hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached. It names the current bundle, so a stale
    # copy points browsers at a deleted file after every deploy — the app then
    # fails to load with no useful error.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Every other path falls through to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. The frontend serves no user content and frames nothing,
    # so these cost nothing and close off the obvious classes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
