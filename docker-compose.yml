# =============================================================================
# Production stack — Neon for the database.
#
# There is no Postgres service here. The database is Neon, the same one the
# developers use, so production and development cannot drift apart and there
# is no server-side volume to back up or migrate.
#
# Backend is `backend/` (formerly biometric-tasks), NOT backend-standalone.
# The legacy project's migration chain cannot build a database from scratch:
# its autogenerated 3486e68d0e91 drops six tables that earlier migrations in
# the same chain never create. It also has no task manager, while the frontend
# expects one.
#
# Server-side .env must provide:
#   DATABASE_URL         the Neon connection string, pasted verbatim
#   VITE_API_BASE_URL    public URL of the API, e.g. https://api.attendance.gridsphere.in
#   JWT_SECRET_KEY       python -c "import secrets; print(secrets.token_urlsafe(64))"
#   GITHUB_ENC_KEY       python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   MQTT_USER, MQTT_PASS
# =============================================================================

services:

  # ─── Redis ─────────────────────────────────────────────────────────────────
  # Kept local deliberately: this is a cache, not a system of record, so it
  # does not belong in Neon and there is nothing to lose if it is dropped.
  # REDIS_URL is optional in the app — leave it out entirely and the app runs.
  redis:
    image: redis:7-alpine
    container_name: biometric_grid_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - biometric_grid_redis_data:/data

    networks:
      - biometric_grid

  # ─── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: biometric_grid_backend
    restart: unless-stopped

    environment:
      PROJECT_NAME: GridSphere IoT Core

      # Neon. Paste the connection string exactly as Neon prints it, including
      # ?sslmode=require — app/db/url.py rewrites the scheme for asyncpg,
      # attaches TLS, and disables prepared statements on the -pooler
      # endpoint. Do not hand-edit it into asyncpg form.
      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: redis://redis:6379/0

      # EMQX on the other VPS
      MQTT_BROKER: mqtt.gridsphere.in
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}

      # Required. Left blank, the server mints a random signing key per
      # process, logging every user out on each restart — and with
      # restart: unless-stopped, on every crash too.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # Blank disables GitHub sync; manual tasks still work. Once set, do not
      # change it — stored GitHub tokens become undecryptable.
      GITHUB_ENC_KEY: ${GITHUB_ENC_KEY:-}
      GITHUB_SYNC_INTERVAL_MINUTES: 30
      GITHUB_SYNC_PAGE_LIMIT: 3

    ports:
      - "9011:8000"

    depends_on:
      redis:
        condition: service_started

    networks:
      - biometric_grid

  # ─── React frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time by Vite — a runtime env var cannot change it,
        # so changing the API address means rebuilding this image. Must be the
        # PUBLIC address of the API, not a container name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: biometric_grid_frontend
    restart: unless-stopped

    ports:
      - "9010:80"

    depends_on:
      - backend

    networks:
      - biometric_grid


volumes:
  # The Postgres volume is intentionally gone. If biometric_grid_postgres_data
  # still exists on the host it is now orphaned — keep it until you are certain
  # nothing in it is needed, then remove it deliberately.
  biometric_grid_redis_data:

networks:
  biometric_grid:
    driver: bridge
